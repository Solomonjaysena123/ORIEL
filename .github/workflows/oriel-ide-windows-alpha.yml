name: ORIEL IDE Windows Alpha

on:
  workflow_dispatch:
  push:
    branches: [oriel-ide-v0.3-windows-alpha]
    paths:
      - 'ide/windows-alpha-app/**'
      - '.github/workflows/oriel-ide-windows-alpha.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ide/windows-alpha-app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Tauri CLI
        run: npm install
      - name: Generate Windows icons
        shell: powershell
        run: npx tauri icon app-icon.svg
      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ORIEL-IDE-Windows-Alpha
          path: ide/windows-alpha-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
