name: Desktop

on:
  push:
  pull_request:

jobs:
  generated-project:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pyinstaller
      - run: oriel desktop new DesktopSmoke --path desktop-build --application-id org.oriel.smoke --version 1.0.0
      - run: oriel desktop validate desktop-build/DesktopSmoke
      - run: oriel desktop package desktop-build/DesktopSmoke
      - run: oriel desktop build desktop-build/DesktopSmoke
