name: Android

on:
  push:
  pull_request:

jobs:
  generated-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: python -m pip install -e .
      - name: Generate and validate Android project
        run: |
          oriel android new AndroidSmoke --path android-build --application-id org.oriel.smoke --version-name 1.0.0 --version-code 1 --permission notifications
          oriel android validate android-build/AndroidSmoke
      - name: Build generated debug APK
        run: gradle --project-dir android-build/AndroidSmoke assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: test -f android-build/AndroidSmoke/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: oriel-android-0.9.6-smoke-apk
          path: android-build/AndroidSmoke/app/build/outputs/apk/debug/app-debug.apk
