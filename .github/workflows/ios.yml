name: iOS

on:
  push:
  pull_request:

jobs:
  generated-project:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install xcodegen
      - run: python -m pip install -e .
      - run: oriel ios new IOSSmoke --path ios-build --bundle-id org.oriel.smoke --version 1.0.0 --build-number 1
      - run: oriel ios validate ios-build/IOSSmoke
      - working-directory: ios-build/IOSSmoke
        run: xcodegen generate
      - working-directory: ios-build/IOSSmoke
        run: xcodebuild -project IOSSmoke.xcodeproj -scheme IOSSmoke -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
